name: desktop-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      cloud_enabled:
        description: "Desktop edition. default = release target (GitHub=open-source, R2=commercial)."
        type: choice
        options: [default, "true", "false"]
        default: default
      server_url:
        description: "VETTA_SERVER_URL override. Required for a commercial build."
        type: string
        required: false
      site_url:
        description: "VETTA_SITE_URL override. Empty keeps Environment / repo value."
        type: string
        required: false
      marketplace_repository:
        description: "Optional GitHub marketplace source for either edition. Empty keeps Environment / repo value."
        type: string
        required: false
      marketplace_ref:
        description: "Optional marketplace Git ref. Empty keeps Environment / repo value, then lets Desktop choose gh-pages for the official source and main for forks."
        type: string
        required: false
      tenant:
        description: "VETTA_TENANT override (packages/plugins/tenants.json)."
        type: string
        required: false
      speech_input:
        description: "VETTA_SPEECH_INPUT_ENABLED. default = Environment / repo variable."
        type: choice
        options: [default, "true", "false"]
        default: default
      channel:
        description: "Rewrite update URL / R2 prefix to stable or test when those path segments exist. Dedicated VETTA_*_TEST / _STABLE vars win."
        type: choice
        options: [default, stable, test]
        default: default
      build_version:
        description: "Test channel only. Semver override for an upgrade candidate, for example 0.5.47."
        type: string
        required: false
      update_url:
        description: "VETTA_UPDATE_URL override."
        type: string
        required: false
      r2_prefix:
        description: "VETTA_R2_PREFIX override (publish job only)."
        type: string
        required: false
      release_target:
        description: "Where a matching tag or stable/test dispatch publishes. default = VETTA_RELEASE_TARGET or github."
        type: choice
        options: [default, r2, github]
        default: default
      notes:
        description: "Shown on the run summary. Not a secret; do not paste keys."
        type: string
        required: false

permissions:
  contents: read

jobs:
  prepare:
    name: resolve desktop release scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'test' && 'desktop-test' || 'desktop-production' }}
    outputs:
      should-build: ${{ steps.scope.outputs.should-build }}
      should-publish: ${{ steps.config.outputs.should_publish }}
      build-version: ${{ steps.config.outputs.build_version }}
      channel: ${{ steps.config.outputs.channel }}
      cloud_enabled: ${{ steps.config.outputs.cloud_enabled }}
      marketplace_repository: ${{ steps.config.outputs.marketplace_repository }}
      marketplace_ref: ${{ steps.config.outputs.marketplace_ref }}
      notes: ${{ steps.config.outputs.notes }}
      r2_bucket: ${{ steps.config.outputs.r2_bucket }}
      r2_prefix: ${{ steps.config.outputs.r2_prefix }}
      release_target: ${{ steps.config.outputs.release_target }}
      server_url: ${{ steps.config.outputs.server_url }}
      site_url: ${{ steps.config.outputs.site_url }}
      speech_input: ${{ steps.config.outputs.speech_input }}
      tenant: ${{ steps.config.outputs.tenant }}
      update_provider: ${{ steps.config.outputs.update_provider }}
      update_url: ${{ steps.config.outputs.update_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Match workflow event to desktop version
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [[ "${REF_NAME}" == "v${VERSION}" ]]; then
            echo "should-build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Ignoring ${REF_NAME}; desktop package version is ${VERSION}."
            echo "should-build=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve release configuration
        if: steps.scope.outputs.should-build == 'true'
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_BUILD_VERSION: ${{ github.event.inputs.build_version }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_CLOUD_ENABLED: ${{ github.event.inputs.cloud_enabled }}
          INPUT_MARKETPLACE_REPOSITORY: ${{ github.event.inputs.marketplace_repository }}
          INPUT_MARKETPLACE_REF: ${{ github.event.inputs.marketplace_ref }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          INPUT_R2_PREFIX: ${{ github.event.inputs.r2_prefix }}
          INPUT_RELEASE_TARGET: ${{ github.event.inputs.release_target }}
          INPUT_SERVER_URL: ${{ github.event.inputs.server_url }}
          INPUT_SITE_URL: ${{ github.event.inputs.site_url }}
          INPUT_SPEECH_INPUT: ${{ github.event.inputs.speech_input }}
          INPUT_TENANT: ${{ github.event.inputs.tenant }}
          INPUT_UPDATE_URL: ${{ github.event.inputs.update_url }}
          VAR_CLOUD_ENABLED: ${{ vars.VETTA_CLOUD_ENABLED }}
          VAR_MARKETPLACE_REPOSITORY: ${{ vars.VETTA_OPEN_MARKETPLACE_REPOSITORY }}
          VAR_MARKETPLACE_REF: ${{ vars.VETTA_OPEN_MARKETPLACE_REF }}
          VAR_R2_BUCKET: ${{ vars.VETTA_R2_BUCKET }}
          VAR_R2_PREFIX: ${{ vars.VETTA_R2_PREFIX }}
          VAR_R2_PREFIX_STABLE: ${{ vars.VETTA_R2_PREFIX_STABLE }}
          VAR_R2_PREFIX_TEST: ${{ vars.VETTA_R2_PREFIX_TEST }}
          VAR_RELEASE_CHANNEL: ${{ vars.VETTA_RELEASE_CHANNEL }}
          VAR_TEST_BUILD_VERSION: ${{ vars.VETTA_TEST_BUILD_VERSION }}
          VAR_RELEASE_TARGET: ${{ vars.VETTA_RELEASE_TARGET }}
          VAR_SERVER_URL: ${{ vars.VETTA_SERVER_URL }}
          VAR_SITE_URL: ${{ vars.VETTA_SITE_URL }}
          VAR_SPEECH_INPUT: ${{ vars.VETTA_SPEECH_INPUT_ENABLED }}
          VAR_TENANT: ${{ vars.VETTA_TENANT }}
          VAR_UPDATE_URL: ${{ vars.VETTA_UPDATE_URL }}
          VAR_UPDATE_URL_STABLE: ${{ vars.VETTA_UPDATE_URL_STABLE }}
          VAR_UPDATE_URL_TEST: ${{ vars.VETTA_UPDATE_URL_TEST }}
        run: node scripts/release/resolve-desktop-release-config.mjs --github-output >> "${GITHUB_OUTPUT}"

      - name: Write resolved config to the job summary
        if: steps.scope.outputs.should-build == 'true'
        env:
          OUTPUT_BUILD_VERSION: ${{ steps.config.outputs.build_version }}
          OUTPUT_CHANNEL: ${{ steps.config.outputs.channel }}
          OUTPUT_CLOUD_ENABLED: ${{ steps.config.outputs.cloud_enabled }}
          OUTPUT_MARKETPLACE_REPOSITORY: ${{ steps.config.outputs.marketplace_repository }}
          OUTPUT_MARKETPLACE_REF: ${{ steps.config.outputs.marketplace_ref }}
          OUTPUT_NOTES: ${{ steps.config.outputs.notes }}
          OUTPUT_R2_BUCKET: ${{ steps.config.outputs.r2_bucket }}
          OUTPUT_R2_PREFIX: ${{ steps.config.outputs.r2_prefix }}
          OUTPUT_RELEASE_TARGET: ${{ steps.config.outputs.release_target }}
          OUTPUT_SHOULD_PUBLISH: ${{ steps.config.outputs.should_publish }}
          OUTPUT_SERVER_URL: ${{ steps.config.outputs.server_url }}
          OUTPUT_SITE_URL: ${{ steps.config.outputs.site_url }}
          OUTPUT_SPEECH_INPUT: ${{ steps.config.outputs.speech_input }}
          OUTPUT_TENANT: ${{ steps.config.outputs.tenant }}
          OUTPUT_UPDATE_PROVIDER: ${{ steps.config.outputs.update_provider }}
          OUTPUT_UPDATE_URL: ${{ steps.config.outputs.update_url }}
        run: node scripts/release/resolve-desktop-release-config.mjs --from-outputs --summary >> "${GITHUB_STEP_SUMMARY}"

  quality:
    name: validate and test Desktop release
    needs: prepare
    if: needs.prepare.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      # im-gateway 的 Go 测试不在 `bun run check` 覆盖范围内，而 im-gateway.yml
      # 只在改动命中 apps/im-gateway/** 时触发、且与本流水线没有 needs 依赖。
      # 缺了这一步，一个测试失败的 sidecar 依然会被 prepare-pack.js 交叉编译进
      # 发布包。lint 留在 im-gateway.yml 管：风格问题不该拦发版，行为回归该拦。
      - name: Set up Go for IM gateway
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/im-gateway/go.mod
          cache-dependency-path: apps/im-gateway/go.sum

      - name: Test IM gateway sidecar
        working-directory: apps/im-gateway
        run: go test ./...

      # 发布说明就是 GitHub Release 的正文。放在这里失败，而不是等四个平台
      # 发布说明就是 GitHub Release 的正文。放在这里失败，而不是等平台打包完成后才发现没有正文。
      - name: Verify release notes exist
        run: node scripts/release/release-notes.mjs --check

      # 私有仓库的标准 runner 内存很小，而 `bun run check` 用 concurrently 并发跑
      # 四路类型检查，desktop 的 tsc 会在默认堆上限（约 2 GB）处 OOM（exit 134），
      # 与代码无关。先单独跑一次 desktop 类型检查：独占内存、放宽堆上限，并写好
      # 增量缓存，随后的 check 复用这份缓存。
      - name: Type check desktop with an isolated heap
        run: bunx tsc --noEmit -p apps/desktop/tsconfig.json --incremental --tsBuildInfoFile node_modules/.desktop-check.tsbuildinfo
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run repository checks
        run: bun run check

      - name: Test quality and release configuration
        run: bun run test:quality

      - name: Verify Desktop packaging contract
        run: bun run verify:desktop:contracts

      - name: Test Desktop packaging helpers
        run: bun run test:desktop:packaging

  build:
    name: build ${{ matrix.platform }}
    needs: [prepare, quality]
    if: needs.prepare.outputs.should-build == 'true'
    # mac 是尽力而为平台：它的失败会显示为红色 job，但不让整轮发布作废（windows / linux
    # 缺失会被 release-gate 拦下）。只有两条 mac matrix 条目带 bestEffort。
    continue-on-error: ${{ matrix.bestEffort == true }}
    runs-on: ${{ matrix.runner }}
    # GitHub macOS packaging intentionally skips Apple signing/notarization; integrity checks and
    # packaged E2E still run. Keep the generous timeout for two-architecture packaging.
    timeout-minutes: 120
    environment: ${{ needs.prepare.outputs.channel == 'test' && 'desktop-test' || 'desktop-production' }}
    strategy:
      fail-fast: false
      matrix: &release-platforms
        include:
          - platform: windows
            runner: windows-latest
            command: dist:win
            verify: verify:updates:windows
            macArch: ""
          # arm64 与 x64 必须分两次构建：内置的 node/python 运行时按
          # VETTA_VENDOR_PLATFORM 单架构落盘，一次构建出不了两套。两次都会写同名的
          # latest-mac.yml，因此各自重命名后上传，由发布任务合并回单一元数据。
          # 两个架构各自使用匹配的 GitHub-hosted runner；常规打包不读取 Apple 签名凭据。
          - platform: macos-arm64
            runner: macos-15
            command: dist:mac:arm64
            verify: verify:updates:mac
            macArch: arm64
            bestEffort: true
          - platform: macos-x64
            runner: macos-15-intel
            command: dist:mac:x64
            verify: verify:updates:mac
            macArch: x64
            bestEffort: true
          - platform: linux
            runner: ubuntu-latest
            command: dist:linux
            verify: verify:updates:linux:release
            macArch: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Set up Go for IM gateway
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/im-gateway/go.mod
          cache-dependency-path: apps/im-gateway/go.sum

      - name: Restore packaging tool downloads
        id: download-cache
        uses: ./.github/actions/desktop-download-cache

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential libcap-dev meson ninja-build pkg-config xz-utils rpm

      - name: Configure macOS packaging without signature checks
        if: matrix.macArch != ''
        shell: bash
        run: |
          # GitHub packaging intentionally uses ad-hoc signing and skips Apple
          # signing/notarization checks. Clear runner-provided credentials so
          # mac-signing-config cannot silently switch back to signed mode.
          {
            echo "VETTA_REQUIRE_MAC_SIGNATURE=0"
            echo "VETTA_MAC_ADHOC_SIGN=1"
            echo "VETTA_SKIP_NOTARIZE="
            echo "CSC_LINK="
            echo "CSC_NAME="
            echo "CSC_KEY_PASSWORD="
            echo "APPLE_TEAM_ID="
            echo "APPLE_ID="
            echo "APPLE_APP_SPECIFIC_PASSWORD="
            echo "APPLE_API_KEY="
            echo "APPLE_API_KEY_ID="
            echo "APPLE_API_ISSUER="
          } >> "${GITHUB_ENV}"
          {
            echo "### macOS package signature checks skipped"
            echo ""
            echo "The GitHub package uses ad-hoc signing; Apple signing and notarization are not required or verified."
          } >> "${GITHUB_STEP_SUMMARY}"

      # release/ 不在版本控制里，actions/checkout 清不掉。复用工作目录的 runner 上
      # 残留的旧版本 latest*.yml 会让合并与发布脚本读到多个版本直接失败。
      - name: Clean previous release artifacts
        shell: bash
        run: rm -rf apps/desktop/release

      - name: Apply resolved release configuration
        shell: bash
        env:
          OUTPUT_BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
          OUTPUT_CHANNEL: ${{ needs.prepare.outputs.channel }}
          OUTPUT_CLOUD_ENABLED: ${{ needs.prepare.outputs.cloud_enabled }}
          OUTPUT_MARKETPLACE_REPOSITORY: ${{ needs.prepare.outputs.marketplace_repository }}
          OUTPUT_MARKETPLACE_REF: ${{ needs.prepare.outputs.marketplace_ref }}
          OUTPUT_NOTES: ${{ needs.prepare.outputs.notes }}
          OUTPUT_R2_BUCKET: ${{ needs.prepare.outputs.r2_bucket }}
          OUTPUT_R2_PREFIX: ${{ needs.prepare.outputs.r2_prefix }}
          OUTPUT_RELEASE_TARGET: ${{ needs.prepare.outputs.release_target }}
          OUTPUT_SHOULD_PUBLISH: ${{ needs.prepare.outputs.should-publish }}
          OUTPUT_SERVER_URL: ${{ needs.prepare.outputs.server_url }}
          OUTPUT_SITE_URL: ${{ needs.prepare.outputs.site_url }}
          OUTPUT_SPEECH_INPUT: ${{ needs.prepare.outputs.speech_input }}
          OUTPUT_TENANT: ${{ needs.prepare.outputs.tenant }}
          OUTPUT_UPDATE_PROVIDER: ${{ needs.prepare.outputs.update_provider }}
          OUTPUT_UPDATE_URL: ${{ needs.prepare.outputs.update_url }}
        run: node scripts/release/resolve-desktop-release-config.mjs --from-outputs --export-env >> "${GITHUB_ENV}"

      - name: Prepare cached release resources
        uses: ./.github/actions/prepare-desktop-resources

      - name: Build updater artifacts
        working-directory: apps/desktop
        env:
          # 由 prepare 解析：dispatch 表单 > desktop-production Environment/仓库 Variables。
          # fork 不配任何值就得到开源版。空 optional 键不会写入 GITHUB_ENV。
          VETTA_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          VETTA_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
        run: bun run ${{ matrix.command }}

      # 验收 job 跑在全新 runner 上，读不到构建机临时目录里的 staged electron-builder 配置，
      # 但 deb/rpm 载荷路径必须按同一份配置推导。这里把推导需要的字段投影进 release/，
      # 随 checkpoint 一起带到验收 job；只投影这三个字段，避免 publish/凭据字段进入发布产物。
      # 构建没产出 staged 配置说明打包流程本身出了问题，所以这一步不做容错。
      - name: Project Linux payload config into the checkpoint
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";
            import { tmpdir } from "node:os";
            const staged = join(tmpdir(), "vetta-desktop-build", "electron-builder.json");
            const config = JSON.parse(readFileSync(staged, "utf8"));
            writeFileSync("apps/desktop/release/linux-payload-config.json", JSON.stringify({
              productName: config.productName,
              executableName: config.executableName,
              linux: { executableName: config.linux?.executableName },
            }));
          '
      # Archive before verification so an E2E/install failure never discards the build.
      # tar preserves executable modes and macOS bundle symlinks across artifact transfer.
      - name: Archive build checkpoint
        shell: bash
        run: |
          echo "${VETTA_REQUIRE_MAC_SIGNATURE:-0}" > apps/desktop/release/require-mac-signature.txt
          # 与 Restore build checkpoint 同理：-C 的路径要用正斜杠形式，Windows 上的 tar 才认。
          WORKSPACE="$(cygpath -m "${GITHUB_WORKSPACE}" 2>/dev/null || printf '%s' "${GITHUB_WORKSPACE}")"
          (cd "${RUNNER_TEMP}" && tar --exclude=builder-debug.yml --exclude=builder-effective-config.yaml -cf release-build.tar -C "${WORKSPACE}/apps/desktop" release)

      - name: Upload build checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-build.tar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - name: Save packaging tool downloads
        if: ${{ !cancelled() && steps.download-cache.outputs.tools-key != '' && steps.download-cache.outputs.tools-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.download-cache.outputs.tools-path }}
          key: ${{ steps.download-cache.outputs.tools-key }}

  verify:
    name: verify ${{ matrix.platform }}
    needs: [prepare, build]
    # 与 build 同一套 matrix：mac 是尽力而为平台，它的校验失败只让这一行变红，不拦住发布
    # （windows / linux 的产物缺失仍由 release-gate 拦下）。
    continue-on-error: ${{ matrix.bestEffort == true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: *release-platforms

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Install Linux Electron runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libasound2t64

      - name: Download build checkpoint
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ matrix.platform }}
          path: ${{ runner.temp }}/release-checkpoint

      - name: Restore build checkpoint
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
        run: |
          rm -rf apps/desktop/release
          # Git Bash 的 GNU tar 在 Windows 上不认 `D:\a\...` 这类反斜杠路径：解包时把它原样
          # 交给 -C 会以 "Cannot open: No such file or directory"（退出码 2）失败。这里用
          # cygpath 换成正斜杠形式；Linux / macOS 上没有 cygpath，原路径本来就合格。没有写成
          # ${VAR//\\//}，因为脚本经 `bash -c` 传递时 Windows 的命令行引号会把反斜杠吃掉。
          WORKSPACE="$(cygpath -m "${GITHUB_WORKSPACE}" 2>/dev/null || printf '%s' "${GITHUB_WORKSPACE}")"
          (cd "${RUNNER_TEMP}/release-checkpoint" && tar -xf release-build.tar -C "${WORKSPACE}/apps/desktop")
          SIGNATURE="$(cat apps/desktop/release/require-mac-signature.txt)"
          case "${SIGNATURE}" in 0|1) ;; *) echo "Invalid signature requirement" >&2; exit 1 ;; esac
          echo "VETTA_REQUIRE_MAC_SIGNATURE=${SIGNATURE}" >> "${GITHUB_ENV}"
          # WDIO's update fixture and Linux AppImage path must use the dispatched candidate version.
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            if (process.env.BUILD_VERSION) {
              if (!/^\d+\.\d+\.\d+$/.test(process.env.BUILD_VERSION)) throw new Error("Invalid build version");
              const file = "apps/desktop/package.json";
              const pkg = JSON.parse(readFileSync(file, "utf8"));
              pkg.version = process.env.BUILD_VERSION;
              writeFileSync(file, JSON.stringify(pkg));
            }
          '

      - name: Verify platform updater artifacts
        if: matrix.verify != ''
        working-directory: apps/desktop
        run: bun run ${{ matrix.verify }}

      # latest.yml 仍只描述自定义 Inno 更新包；MSI/ZIP 是额外下载格式，单独解包
      # 检查它们是否保留 launcher + versions/<version> 的可更新目录布局。
      - name: Verify supplemental Windows packages
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: bun run verify:packages:windows

      # 包内清单校验能捕获元数据和路径错误；容器安装再覆盖 dpkg/dnf 的真实事务、
      # desktop entry 与 electron-updater 用于选择 deb/rpm 的 package-type 标记。
      #
      # 容器脚本整体由外层单引号包裹，脚本内部只能再用双引号：内层单引号会提前闭合
      # 外层引号，外层 shell 随即吃掉反斜杠（-printf '%h\n' 会变成 -printf %hn），
      # 检查会在没有任何输出的情况下失败。
      #
      # 探测整体最多重试三次：安全镜像偶发「索引里还有、pool 里已被替换」的 404（例如
      # libexpat1 的某个小版本），apt 会以 100 退出，让一次与产物无关的镜像抖动作废整轮
      # 发布。真正的产物问题会让三次探测全部失败，结论不变。
      - name: Verify native Linux package installation
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        shell: bash
        run: |
          probe_linux_packages() {
            docker run --rm --volume "${PWD}/release:/release:ro" ubuntu:24.04 bash -euo pipefail -c '
              apt-get update
              apt-get install --yes /release/*.deb
              binary="$(find /opt -mindepth 2 -maxdepth 2 -type f -name MetoAI -print -quit)"
              test -n "${binary}" || { echo "no MetoAI executable installed under /opt" >&2; ls -l /opt >&2; exit 1; }
              app_dir="$(dirname "${binary}")"
              test -x "${app_dir}/MetoAI"
              test "$(cat "${app_dir}/resources/package-type")" = "deb"
              find /usr/share/applications -maxdepth 1 -type f -iname "*metoai*.desktop" -print -quit | grep -q . || { echo "no desktop entry installed" >&2; ls -l /usr/share/applications >&2; exit 1; }
            '
            docker run --rm --volume "${PWD}/release:/release:ro" fedora:latest bash -euo pipefail -c '
              dnf install --assumeyes --nogpgcheck /release/*.rpm
              binary="$(find /opt -mindepth 2 -maxdepth 2 -type f -name MetoAI -print -quit)"
              test -n "${binary}" || { echo "no MetoAI executable installed under /opt" >&2; ls -l /opt >&2; exit 1; }
              app_dir="$(dirname "${binary}")"
              test -x "${app_dir}/MetoAI"
              test "$(cat "${app_dir}/resources/package-type")" = "rpm"
              find /usr/share/applications -maxdepth 1 -type f -iname "*metoai*.desktop" -print -quit | grep -q . || { echo "no desktop entry installed" >&2; ls -l /usr/share/applications >&2; exit 1; }
            '
          }
          for attempt in 1 2 3; do
            if probe_linux_packages; then exit 0; fi
            echo "Linux package probe failed (attempt ${attempt}/3); a stale package mirror can cause this, retrying." >&2
            sleep 20
          done
          echo "Linux package probe failed after 3 attempts." >&2
          exit 1

      - name: Run packaged app and updater E2E
        working-directory: apps/desktop
        env:
          VETTA_E2E_PACKAGED: "1"
          VETTA_E2E_UPDATE_FEED: "1"
          VETTA_SPEECH_INPUT_ENABLED: "false"
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            xvfb-run --auto-servernum bun run test:e2e:packaged
          else
            bun run test:e2e:packaged
          fi

      - name: Re-verify platform updater artifacts after packaged E2E
        if: matrix.verify != ''
        working-directory: apps/desktop
        run: bun run ${{ matrix.verify }}

      - name: Name macOS update metadata per architecture
        if: matrix.macArch != ''
        working-directory: apps/desktop
        shell: bash
        run: mv release/latest-mac.yml "release/latest-mac-${{ matrix.macArch }}.yml"

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.rpm
            apps/desktop/release/*.zip
            apps/desktop/release/latest*.yml

  # mac 是尽力而为平台：它的失败会显示为红色 job，但不让整轮发布作废。这个 gate 只看
  # 「产物是否真的产出」，而不是「job 是否成功」：windows / linux 的元数据缺失就让本 job
  # 失败，两个 publish job 随之被跳过（与改造前一致）；mac 缺席只从 feed 校验清单里去掉 mac。
  release-gate:
    name: release gate
    # 产物由 verify 上传：gate 必须等它跑完才下载，否则会看到「没有产物」的假结论。
    needs: [prepare, build, verify]
    # always()：build 里有红色 job 时也要给出确定性结论。叠加 should-build 判断，避免
    # 不该构建的运行（例如只改文档）也去下载根本不存在的产物。
    if: always() && needs.prepare.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      built-platforms: ${{ steps.platforms.outputs.built-platforms }}
    steps:
      - name: Download Windows updater artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release/windows
          if-no-files-found: error

      - name: Download Linux updater artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: release/linux
          if-no-files-found: error

      - name: Download macOS arm64 updater artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release/macos-arm64
          if-no-files-found: ignore

      - name: Download macOS x64 updater artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-x64
          path: release/macos-x64
          if-no-files-found: ignore

      # 按 windows → linux → macos 的固定顺序输出实际产出的平台，供 publish 的 feed 校验收口。
      - name: Resolve built platforms
        id: platforms
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BUILT=()
          MISSING=()
          if [[ -f release/windows/latest.yml ]]; then
            BUILT+=(windows)
          else
            MISSING+=(windows)
          fi
          if [[ -f release/linux/latest-linux.yml ]]; then
            BUILT+=(linux)
          else
            MISSING+=(linux)
          fi
          shopt -s nullglob
          MACOS_METADATA=(release/macos-*/latest-mac-*.yml)
          if [[ "${#MACOS_METADATA[@]}" -gt 0 ]]; then
            BUILT+=(macos)
          else
            echo "macOS updater metadata is absent; the macOS artifacts are best-effort and the feed is verified without them."
          fi
          echo "built-platforms=$(IFS=,; echo "${BUILT[*]}")" >> "${GITHUB_OUTPUT}"
          if [[ "${#MISSING[@]}" -ne 0 ]]; then
            echo "::error::Required release platforms produced no updater metadata: ${MISSING[*]}"
            exit 1
          fi

  publish-r2:
    name: publish R2
    if: needs.prepare.outputs.should-build == 'true' && needs.prepare.outputs.should-publish == 'true' && needs.prepare.outputs.release_target == 'r2'
    needs: [prepare, quality, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.prepare.outputs.channel == 'test' && 'desktop-test' || 'desktop-production' }}
    concurrency:
      group: desktop-${{ needs.prepare.outputs.channel }}-publish
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: apps/desktop/release

      - name: Merge macOS update metadata
        working-directory: apps/desktop
        run: bun run merge:updates:mac

      - name: Apply resolved release configuration
        shell: bash
        env:
          OUTPUT_BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
          OUTPUT_CHANNEL: ${{ needs.prepare.outputs.channel }}
          OUTPUT_CLOUD_ENABLED: ${{ needs.prepare.outputs.cloud_enabled }}
          OUTPUT_MARKETPLACE_REPOSITORY: ${{ needs.prepare.outputs.marketplace_repository }}
          OUTPUT_MARKETPLACE_REF: ${{ needs.prepare.outputs.marketplace_ref }}
          OUTPUT_NOTES: ${{ needs.prepare.outputs.notes }}
          OUTPUT_R2_BUCKET: ${{ needs.prepare.outputs.r2_bucket }}
          OUTPUT_R2_PREFIX: ${{ needs.prepare.outputs.r2_prefix }}
          OUTPUT_RELEASE_TARGET: ${{ needs.prepare.outputs.release_target }}
          OUTPUT_SHOULD_PUBLISH: ${{ needs.prepare.outputs.should-publish }}
          OUTPUT_SERVER_URL: ${{ needs.prepare.outputs.server_url }}
          OUTPUT_SITE_URL: ${{ needs.prepare.outputs.site_url }}
          OUTPUT_SPEECH_INPUT: ${{ needs.prepare.outputs.speech_input }}
          OUTPUT_TENANT: ${{ needs.prepare.outputs.tenant }}
          OUTPUT_UPDATE_PROVIDER: ${{ needs.prepare.outputs.update_provider }}
          OUTPUT_UPDATE_URL: ${{ needs.prepare.outputs.update_url }}
        run: node scripts/release/resolve-desktop-release-config.mjs --from-outputs --export-env >> "${GITHUB_ENV}"

      - name: Publish artifacts before metadata
        working-directory: apps/desktop
        env:
          VETTA_R2_ACCOUNT_ID: ${{ secrets.VETTA_R2_ACCOUNT_ID }}
          VETTA_R2_ACCESS_KEY_ID: ${{ secrets.VETTA_R2_ACCESS_KEY_ID }}
          VETTA_R2_SECRET_ACCESS_KEY: ${{ secrets.VETTA_R2_SECRET_ACCESS_KEY }}
        run: bun run publish:updates:r2

      - name: Verify published update feed
        working-directory: apps/desktop
        env:
          VETTA_DESKTOP_RELEASE_VERSION: ${{ needs.prepare.outputs.build-version }}
          # mac 是尽力而为平台：只校验本次真正产出的平台，缺失的 mac 元数据不算失败。
          VETTA_UPDATE_FEED_PLATFORMS: ${{ needs.release-gate.outputs.built-platforms }}
        run: node scripts/verify-update-feed.mjs

  # R2 目标也要发 GitHub Release：R2 是更新源，GitHub Release 是对外的下载入口和
  # 版本说明归档，两者同时发布。test 渠道除外——它的构建不该出现在正式 Release 列表里。
  publish-github:
    name: publish GitHub Release
    if: needs.prepare.outputs.should-build == 'true' && needs.prepare.outputs.should-publish == 'true' && needs.prepare.outputs.channel != 'test'
    needs: [prepare, quality, release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-production
    concurrency:
      group: desktop-production-publish
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        uses: ./.github/actions/install-bun-dependencies

      - name: Download updater artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: apps/desktop/release

      - name: Merge macOS update metadata
        working-directory: apps/desktop
        run: bun run merge:updates:mac

      - name: Publish release after all assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build-version }}
        shell: bash
        run: |
          VERSION="${BUILD_VERSION:-$(node -p "require('./apps/desktop/package.json').version")}"
          TAG="v${VERSION}"
          NOTES_FILE="$(node scripts/release/release-notes.mjs --version "${VERSION}")"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG}" --json isDraft --jq .isDraft)"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Refusing to modify published release ${TAG}." >&2
              exit 1
            fi
            echo "Resuming draft release ${TAG}"
            # 复用已存在的 draft 时也要把标题写回：否则会沿用别人（或上一次运行）留下的旧标题，
            # 线上就出现过 Release 标题变成提交信息的情况。
            gh release edit "${TAG}" --notes-file "${NOTES_FILE}" --title "MetoAI ${VERSION}"
          else
            gh release create "${TAG}" --draft --notes-file "${NOTES_FILE}" --title "MetoAI ${VERSION}" --target "${GITHUB_SHA}"
          fi
          find apps/desktop/release -maxdepth 1 -type f -print0 \
            | xargs -0 gh release upload "${TAG}" --clobber
          gh release edit "${TAG}" --draft=false

      - name: Verify published update feed
        working-directory: apps/desktop
        env:
          VETTA_DESKTOP_RELEASE_VERSION: ${{ needs.prepare.outputs.build-version }}
          # mac 是尽力而为平台：只校验本次真正产出的平台，缺失的 mac 元数据不算失败。
          VETTA_UPDATE_FEED_PLATFORMS: ${{ needs.release-gate.outputs.built-platforms }}
          VETTA_UPDATE_PROVIDER: github
          VETTA_UPDATE_GITHUB_OWNER: ${{ github.repository_owner }}
          VETTA_UPDATE_GITHUB_REPO: ${{ github.event.repository.name }}
        run: node scripts/verify-update-feed.mjs
